name: Sync npm lockfile

on:
  push:
    branches: [ci/portfolio-quality-gate]
    paths:
      - package.json
      - .github/workflows/sync-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ci/portfolio-quality-gate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
          else
            git commit -m "chore: synchronize npm lockfile"
            git push origin HEAD:ci/portfolio-quality-gate
          fi
